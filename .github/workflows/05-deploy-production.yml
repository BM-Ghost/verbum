# ─────────────────────────────────────────────────────────────────────────────
# Verbum · Deploy — Production (Google Play Store)
# ─────────────────────────────────────────────────────────────────────────────
# Triggers: push/merge into main, or manual dispatch.
# Runs full release validation, builds a signed AAB, waits for MANUAL APPROVAL
# in the `production` environment, deploys to the Play Store internal track,
# and creates a versioned GitHub Release.
#
# Workflow:  main merge → final validation → [manual approval] → sign AAB
#            → Play Store internal → GitHub Release tag
#
# Required secrets (production environment-scoped):
#   KEYSTORE_BASE64                  – base64-encoded production keystore (.jks)
#   KEYSTORE_PASSWORD                – keystore store password
#   KEY_ALIAS                        – key alias
#   KEY_PASSWORD                     – key password
#   PLAY_STORE_SERVICE_ACCOUNT_JSON  – Google Play service account JSON key
#
# app/build.gradle.kts signing config must reference env vars:
#   signingConfigs.create("release") {
#     storeFile   = file(System.getenv("KEYSTORE_FILE_PATH") ?: "")
#     storePassword = System.getenv("KEYSTORE_PASSWORD") ?: ""
#     keyAlias    = System.getenv("KEY_ALIAS") ?: ""
#     keyPassword = System.getenv("KEY_PASSWORD") ?: ""
#   }
# ─────────────────────────────────────────────────────────────────────────────
name: "Deploy — Production"

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      track:
        description: "Play Store track"
        required: true
        default: "internal"
        type: choice
        options: [internal, alpha, beta, production]
      release_status:
        description: "Release status"
        required: true
        default: "draft"
        type: choice
        options: [draft, completed]

concurrency:
  group: "deploy-production"
  cancel-in-progress: false

permissions:
  contents: write    # Needed to create GitHub Release tags
  checks: write

env:
  JAVA_VERSION: "17"
  JAVA_DISTRIBUTION: "temurin"
  GRADLE_OPTS: "-Xmx4g -Xms512m -Dfile.encoding=UTF-8"
  PACKAGE_NAME: "com.verbum.app"

jobs:
  # ─── Final production validation ────────────────────────────────────────────
  final-validation:
    name: "Final Production Validation"
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: gradle

      - uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: true
          add-job-summary: always

      - name: Engineering Guidelines
        run: ./gradlew verifyVerbumGuidelines --no-daemon

      - name: Android Lint (release)
        run: ./gradlew lintRelease --no-daemon

      - name: Unit Tests (release)
        run: ./gradlew testReleaseUnitTest --no-daemon --continue

      - name: Upload Validation Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "validation-prod-${{ github.run_number }}"
          path: |
            **/build/reports/lint-results-release.html
            **/build/test-results/**/*.xml
          retention-days: 30

  # ─── Build, sign, release — requires manual approval ────────────────────────
  build-and-release:
    name: "Build AAB · Sign · Deploy to Play Store"
    needs: final-validation
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    environment: production   # ← manual approval gate; deployment branches: main only
    permissions:
      contents: write          # Create GitHub Release
      id-token: write          # OIDC — only this job needs Workload Identity Federation

    steps:
      - name: Checkout (full history for release notes)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: gradle

      - uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: true

      # ── Extract version from build.gradle.kts ─────────────────────────────
      - name: Extract Version Info
        id: version
        run: |
          VERSION_NAME=$(grep -m1 'versionName\s*=' app/build.gradle.kts | grep -oP '"[^"]+"' | tr -d '"')
          VERSION_CODE=$(grep -m1 'versionCode\s*=' app/build.gradle.kts | grep -oP '[0-9]+')
          echo "version_name=${VERSION_NAME:-0.0.0}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE:-${{ github.run_number }}}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION_NAME:-0.0.0}" >> "$GITHUB_OUTPUT"
          echo "📦 Version: ${VERSION_NAME} (${VERSION_CODE})"

      # ── Sign ──────────────────────────────────────────────────────────────
      - name: Decode Production Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/verbum-production.keystore

      # ── Build AAB ─────────────────────────────────────────────────────────
      - name: Build Release AAB
        run: ./gradlew :app:bundleRelease --no-daemon
        env:
          KEYSTORE_FILE_PATH: verbum-production.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Verify AAB Produced
        run: |
          AAB="app/build/outputs/bundle/release/app-release.aab"
          [[ -f "$AAB" ]] || { echo "❌ AAB not found at $AAB"; exit 1; }
          echo "✅ AAB verified: $(du -h $AAB | cut -f1)"

      - name: Upload AAB Artifact (90-day retention for compliance)
        uses: actions/upload-artifact@v4
        with:
          name: "verbum-production-aab-${{ steps.version.outputs.version_name }}-${{ github.run_number }}"
          path: "app/build/outputs/bundle/release/app-release.aab"
          retention-days: 90

      # ── Deploy to Play Store ──────────────────────────────────────────────
      - name: Upload to Google Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track || 'internal' }}
          status: ${{ github.event.inputs.release_status || 'draft' }}

      # ── Create GitHub Release ─────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ steps.version.outputs.tag }}"
          name: "Verbum ${{ steps.version.outputs.tag }} (build ${{ github.run_number }})"
          body: |
            ## Verbum ${{ steps.version.outputs.version_name }}

            **Play Store track:** `${{ github.event.inputs.track || 'internal' }}`
            **Build:** `${{ github.run_number }}`
            **Commit:** `${{ github.sha }}`
            **Deployed by:** `@${{ github.actor }}`
          files: "app/build/outputs/bundle/release/app-release.aab"
          draft: false
          prerelease: false
          generate_release_notes: true

      # ── Clean up ──────────────────────────────────────────────────────────
      - name: Clean up Keystore
        if: always()
        run: rm -f app/verbum-production.keystore
