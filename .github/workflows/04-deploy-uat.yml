# ─────────────────────────────────────────────────────────────────────────────
# Verbum · Deploy — UAT (User Acceptance Testing)
# ─────────────────────────────────────────────────────────────────────────────
# Triggers: push/merge into uat, or manual dispatch.
# Runs release-mode validation (lint-release + testReleaseUnitTest), builds a
# signed release APK, then waits for MANUAL APPROVAL before distributing to
# the UAT tester group on Firebase App Distribution.
#
# GitHub Environment `uat` must be configured with required reviewers.
#
# Required secrets (repo-level or uat environment):
#   KEYSTORE_BASE64               – base64-encoded release keystore (.jks)
#   KEYSTORE_PASSWORD             – keystore store password
#   KEY_ALIAS                     – key alias
#   KEY_PASSWORD                  – key password
#   FIREBASE_APP_ID_UAT           – Firebase App ID for the UAT variant
#   FIREBASE_SERVICE_ACCOUNT_JSON – Firebase service account with App Distribution role
# ─────────────────────────────────────────────────────────────────────────────
name: "Deploy — UAT"

on:
  push:
    branches: [uat]
  workflow_dispatch:
    inputs:
      release_notes:
        description: "Release notes for UAT testers"
        required: false
        default: "UAT release candidate — please validate all core user flows."

concurrency:
  group: "deploy-uat"
  cancel-in-progress: false

permissions:
  contents: read
  checks: write

env:
  JAVA_VERSION: "17"
  JAVA_DISTRIBUTION: "temurin"
  GRADLE_OPTS: "-Xmx4g -Xms512m -Dfile.encoding=UTF-8"

jobs:
  # ─── Full release validation ─────────────────────────────────────────────────
  validate:
    name: "Release Validation"
    runs-on: ubuntu-22.04
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: gradle

      - uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: true

      - name: Engineering Guidelines
        run: ./gradlew verifyVerbumGuidelines --no-daemon

      - name: Android Lint (release)
        run: ./gradlew lintRelease --no-daemon

      - name: Unit Tests (release)
        run: ./gradlew testReleaseUnitTest --no-daemon --continue

      - name: Release Compile Check
        run: ./gradlew :app:compileReleaseKotlin --no-daemon

  # ─── Build & distribute — requires manual approval ──────────────────────────
  build-and-distribute:
    name: "Build Release APK & Distribute to UAT"
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    environment: uat   # ← manual approval gate configured in GitHub Environments

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: gradle

      - uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: true

      - name: Decode Release Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/verbum-release.keystore

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease --no-daemon
        env:
          KEYSTORE_FILE_PATH: verbum-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Verify APK Produced
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          [[ -f "$APK" ]] || { echo "❌ Release APK not found"; exit 1; }
          echo "✅ APK: $(du -h $APK | cut -f1)"

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: "verbum-uat-${{ github.run_number }}"
          path: "app/build/outputs/apk/release/app-release.apk"
          retention-days: 30

      - name: Distribute to Firebase App Distribution (UAT)
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID_UAT }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          groups: uat-testers
          file: app/build/outputs/apk/release/app-release.apk
          releaseNotes: |
            ${{ github.event.inputs.release_notes || format('UAT RC #{0} | {1}', github.run_number, github.sha) }}

      - name: Clean up Keystore
        if: always()
        run: rm -f app/verbum-release.keystore
