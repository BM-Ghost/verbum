# ─────────────────────────────────────────────────────────────────────────────
# Verbum · PR Validation
# ─────────────────────────────────────────────────────────────────────────────
# Triggers: every PR targeting dev, sit, uat, or main.
# All jobs are mandatory status checks — configure them under branch protection.
# Draft PRs are skipped automatically.
# ─────────────────────────────────────────────────────────────────────────────
name: "PR Validation"

on:
  pull_request:
    branches: [dev, sit, uat, main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: "pr-validation-${{ github.event.pull_request.number }}-${{ github.event.action }}"
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

defaults:
  run:
    shell: bash

env:
  JAVA_VERSION: "17"
  JAVA_DISTRIBUTION: "temurin"
  GRADLE_OPTS: "-Xmx4g -Xms512m -Dfile.encoding=UTF-8"

# ─────────────────────────────────────────────────────────────────────────────
jobs:
  # ─── 0. Branch Naming Convention (PRs to dev only) ──────────────────────────
  branch-name:
    name: "Branch Naming Convention"
    # Only enforced for PRs targeting dev — sit/uat/main are admin-managed
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.base.ref == 'dev' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5

    steps:
      - name: Validate branch name
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          echo "Branch: $BRANCH"
          if [[ "$BRANCH" =~ ^(feature|ft)-.+ ]]; then
            echo "✅ Branch name is valid: $BRANCH"
          else
            echo ""
            echo "❌ Branch name '$BRANCH' does not follow the required naming convention."
            echo ""
            echo "All contributor PRs targeting 'dev' must originate from a branch named:"
            echo "  • feature-<description>   e.g. feature-bible-search"
            echo "  • ft-<description>        e.g. ft-prayer-detail-screen"
            echo ""
            echo "Rename your branch and re-open the PR:"
            echo "  git branch -m $BRANCH feature-<your-description>"
            echo "  git push origin feature-<your-description>"
            echo "  git push origin --delete $BRANCH"
            exit 1
          fi

  # ─── 1. Engineering Guidelines ──────────────────────────────────────────────
  guidelines:
    name: "Engineering Guidelines"
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: true
          add-job-summary: on-failure

      - name: Verify Verbum Engineering Guidelines
        run: ./gradlew verifyVerbumGuidelines --no-daemon

  # ─── 2. Android Lint ────────────────────────────────────────────────────────
  lint:
    name: "Android Lint"
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: gradle

      - uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: true

      - name: Run Android Lint
        run: ./gradlew lintDebug --no-daemon

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "lint-report-pr${{ github.event.pull_request.number }}"
          path: "**/build/reports/lint-results-debug.html"
          retention-days: 7

  # ─── 3. Unit Tests ──────────────────────────────────────────────────────────
  unit-tests:
    name: "Unit Tests"
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: gradle

      - uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: true

      - name: Run Unit Tests (all modules)
        run: ./gradlew testDebugUnitTest --no-daemon --continue

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "test-results-pr${{ github.event.pull_request.number }}"
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/tests/**
          retention-days: 7

      - name: Publish Test Report on PR
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: "**/build/test-results/**/*.xml"
          check_name: "Unit Test Results"
          comment_mode: failures
          fail_on: "test failures"

  # ─── 4. Build Verification ──────────────────────────────────────────────────
  build-check:
    name: "Build Verification"
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: gradle

      - uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: true

      - name: Compile Kotlin (all modules)
        run: ./gradlew :app:compileDebugKotlin --no-daemon

      - name: Assemble Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: "debug-apk-pr${{ github.event.pull_request.number }}"
          path: "app/build/outputs/apk/debug/app-debug.apk"
          retention-days: 3

  # ─── 5. Dependency Review (supply-chain security) ───────────────────────────
  dependency-review:
    name: "Dependency Review"
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    # Note: requires GitHub Advanced Security for private repos,
    #       or works automatically on public repos.
    steps:
      - uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          # Reject licences incompatible with Play Store distribution
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0, SSPL-1.0

  # ─── Gate: required jobs must all pass ──────────────────────────────────────
  pr-gate:
    name: "✅ PR Gate"
    needs: [branch-name, guidelines, lint, unit-tests, build-check, dependency-review]
    if: always() && !github.event.pull_request.draft
    runs-on: ubuntu-22.04
    steps:
      - name: Evaluate required job results
        env:
          STATUSES: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job statuses: $STATUSES"
          if echo "$STATUSES" | grep -qE 'failure|cancelled'; then
            echo "❌ One or more required validation jobs failed."
            exit 1
          fi
          echo "✅ All PR validation checks passed."
