# ─────────────────────────────────────────────────────────────────────────────
# Verbum · Security Scan
# ─────────────────────────────────────────────────────────────────────────────
# Triggers:
#   • Every Monday at 03:00 UTC (weekly schedule)
#   • Every push to main or uat
#   • Manual dispatch
#
# Jobs:
#   1. CodeQL — static analysis for Java/Kotlin (SAST)
#   2. Dependency submission — submits dependency graph for GitHub's vulnerability alerts
#   3. Secret detection — TruffleHog scans for accidentally committed credentials
# ─────────────────────────────────────────────────────────────────────────────
name: "Security Scan"

on:
  schedule:
    - cron: "0 3 * * 1"   # Weekly: Monday 03:00 UTC
  push:
    branches: [main, uat]
  workflow_dispatch:

concurrency:
  group: "security-scan-${{ github.ref }}"
  cancel-in-progress: false

permissions:
  contents: read
  security-events: write   # Upload SARIF to GitHub Security tab
  actions: read

env:
  JAVA_VERSION: "17"
  JAVA_DISTRIBUTION: "temurin"
  GRADLE_OPTS: "-Xmx4g -Xms512m -Dfile.encoding=UTF-8"

jobs:
  # ─── 1. CodeQL — Static Application Security Testing ────────────────────────
  codeql:
    name: "CodeQL — SAST (Java/Kotlin)"
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: gradle

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          # Extended security queries + quality checks
          queries: security-extended, security-and-quality

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
        with:
          cache-read-only: true

      - name: Build for CodeQL Analysis
        run: ./gradlew :app:compileDebugKotlin --no-daemon

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java-kotlin"
          upload: true

  # ─── 2. Dependency Submission (GitHub vulnerability alerts) ─────────────────
  dependency-submission:
    name: "Dependency Graph Submission"
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write   # Required for dependency graph submission

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: gradle

      - name: Submit Gradle Dependency Graph
        uses: gradle/actions/dependency-submission@v6.2.0
        with:
          # Generates and submits the dependency graph to enable
          # GitHub Dependabot vulnerability alerts for Gradle dependencies
          dependency-graph: generate-and-submit

  # ─── 3. Secret Detection — TruffleHog ───────────────────────────────────────
  secret-scan:
    name: "Secret Leak Detection"
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog — Scan for Leaked Credentials
        uses: trufflesecurity/trufflehog@v3
        with:
          path: ./
          base: ${{ github.event.before || github.event.repository.default_branch }}
          head: HEAD
          # Only report verified findings to reduce noise
          extra_args: --only-verified
