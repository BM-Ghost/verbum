---
name: "Bug Report"
description: "Report a reproducible bug in the Verbum app"
title: "[Bug]: "
labels: ["bug", "needs-triage"]
assignees:
  - BM-Ghost

body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug. Please fill in as much detail as possible to help us reproduce and fix the issue.

  - type: textarea
    id: description
    attributes:
      label: "Bug Description"
      description: "A clear and concise description of what the bug is."
      placeholder: "Describe the unexpected behavior…"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "Steps to Reproduce"
      description: "Numbered steps to reliably reproduce the bug."
      placeholder: |
        1. Open the app
        2. Navigate to '...'
        3. Tap '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior"
      description: "What should have happened?"
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: "Actual Behavior"
      description: "What actually happened? Include screenshots or screen recordings if applicable."
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: "Severity"
      description: "How severe is the impact?"
      options:
        - "💥 Crash — app crashes or becomes unusable"
        - "🔴 Major — core functionality broken but app survives"
        - "🟡 Minor — cosmetic or edge-case issue"
    validations:
      required: true

  - type: dropdown
    id: affected_feature
    attributes:
      label: "Affected Feature / Module"
      description: "Which feature area is affected?"
      multiple: true
      options:
        - "Bible Reader"
        - "Missal"
        - "Prayer"
        - "Liturgical Calendar"
        - "Community"
        - "AI Verbum"
        - "Auth / Login"
        - "Profile"
        - "Home"
        - "Other / Core"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: "Device & Android Version"
      description: "e.g. Pixel 7 — Android 14 (API 34)"
      placeholder: "Device model — Android X.X (API XX)"
    validations:
      required: true

  - type: input
    id: app_version
    attributes:
      label: "App Version"
      description: "Found in Profile → About. e.g. 1.0.0 (42)"
      placeholder: "1.0.0 (42)"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: "Crash Logs / Logcat Output"
      description: "Paste relevant crash stacktrace or logcat output here."
      render: text
    validations:
      required: false
